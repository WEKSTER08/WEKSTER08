name: voxvault
on:
  push:
    paths: ['voxvault/**', '.github/workflows/voxvault.yml']
  pull_request:
    paths: ['voxvault/**', '.github/workflows/voxvault.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voxvault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: voxvault/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
